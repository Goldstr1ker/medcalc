name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, нужные для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно только один деплой; новый пуш отменяет предыдущий
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Схема калькуляторов и формулы проверяются до сборки: битая схема
      # или разъехавшаяся формула не должны доехать до Pages.
      # То же самое запускает хук prebuild — здесь отдельными шагами,
      # чтобы в интерфейсе Actions было сразу видно, что именно упало.
      - name: Проверка типов
        run: npm run typecheck
      - name: Проверка схемы калькуляторов
        run: npm run validate
      - name: Тесты формул
        run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
